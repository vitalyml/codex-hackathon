[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
loguru = "^0.7.2"
python-dotenv = "^1.0.1"
google-genai = "^2.22.0"
httpx = "^0.28.1"
numpy = "^2.2"
opencv-python-headless = "^5.0.0.93"
fastapi = "^0.141.1"
uvicorn = "^0.52.4"
python-multipart = "^0.0.32"
segno = "^1.6.6"
cryptography = ">=46,<51"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
isort = "^5.13.0"
mypy = "^1.15.0"
ipykernel = "^7.3.0"
jupyterlab = "^4.6.3"
jupyter-collaboration = "^5.0.3"
pillow = "^12.3.0"
opencv-python = "^5.0.0.93"
pytest-asyncio = "^1.4.0"
google-genai = "^2.23.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
exclude = "(^tests/)"
