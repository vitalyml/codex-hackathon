services:
  - type: web
    name: codex-hackathon
    runtime: python
    plan: free
    buildCommand: pip install poetry && poetry install --only main --no-root
    startCommand: poetry run python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"
      - key: POETRY_VIRTUALENVS_IN_PROJECT
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: OPENAI_API_KEYS
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: MAX_SESSIONS
        value: "10"
      - key: SESSION_TTL
        value: "30"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CONVEX_URL
        sync: false
      - key: WORKER_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
